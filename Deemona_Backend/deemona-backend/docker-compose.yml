version: '3.9'

# ============================================================
#  Deemona MySQL Stack
#  Services: api (Node.js) + mysql (MySQL 8) + nginx
#  Usage:
#    docker compose up -d --build
#    docker compose logs -f
# ============================================================

services:

  mysql:
    image: mysql:8.0
    container_name: deemona-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-Deemona@Strong123!}
      MYSQL_DATABASE:      ${DB_NAME:-deemona}
      MYSQL_USER:          ${DB_USER:-deemona}
      MYSQL_PASSWORD:      ${DB_PASS:-Deemona@Strong123!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migration.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"   # expose for local GUI tools; remove in production
    networks:
      - deemona-net
    healthcheck:
      test:         ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-Deemona@Strong123!}"]
      interval:     15s
      timeout:      10s
      retries:      8
      start_period: 40s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password

  api:
    build:
      context:    .
      dockerfile: Dockerfile
      target:     production
    container_name: deemona-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV:   production
      PORT:       3000
      DB_SERVER:  mysql
      DB_PORT:    3306
      DB_NAME:    ${DB_NAME:-deemona}
      DB_USER:    root
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - deemona-net
    healthcheck:
      test:         ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval:     30s
      timeout:      10s
      start_period: 30s
      retries:      5

  nginx:
    image: nginx:1.25-alpine
    container_name: deemona-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
      - ssl_certs:/etc/letsencrypt:ro
    networks:
      - deemona-net

volumes:
  mysql_data:
    name: deemona_mysql_data
  uploads_data:
    name: deemona_uploads
  ssl_certs:
    name: deemona_ssl

networks:
  deemona-net:
    name: deemona_network
    driver: bridge
