version: '3.9'

# ============================================================
#  Deemona — Full Production Stack
#
#  Services:
#    frontend   — React SPA served by Nginx on :80
#    api        — Express.js API on :3000 (internal only)
#    sqlserver  — SQL Server 2022 on :1433 (internal only)
#
#  Usage:
#    docker compose up -d               # start all services
#    docker compose up -d --build       # rebuild images
#    docker compose logs -f api         # follow API logs
#    docker compose down                # stop all
# ============================================================

services:

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context:    ./deemona-frontend
      dockerfile: Dockerfile
      target:     production
    container_name: deemona-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=/api
    networks:
      - deemona-net
    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout:  5s
      retries:  3

  # ── API ───────────────────────────────────────────────────
  api:
    build:
      context:    ./deemona-backend
      dockerfile: Dockerfile
      target:     production
    container_name: deemona-api
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      sqlserver:
        condition: service_healthy
    env_file:
      - ./deemona-backend/.env
    environment:
      NODE_ENV:   production
      PORT:       3000
      DB_SERVER:  sqlserver
      DB_PORT:    1433
      DB_NAME:    DeemonaDB
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - deemona-net
    healthcheck:
      test:            ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval:        30s
      timeout:         10s
      start_period:    40s
      retries:         5

  # ── SQL Server ────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: deemona-sqlserver
    restart: unless-stopped
    expose:
      - "1433"
    environment:
      ACCEPT_EULA:       Y
      MSSQL_SA_PASSWORD: ${DB_PASS:-Deemona@Strong123!}
      MSSQL_PID:         Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - deemona-net
    healthcheck:
      test:         ["/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASS:-Deemona@Strong123!}", "-Q", "SELECT 1", "-No", "-l", "30"]
      interval:     20s
      timeout:      15s
      retries:      10
      start_period: 90s

  # ── Dev profile: hot-reload frontend ─────────────────────
  frontend-dev:
    build:
      context:    ./deemona-frontend
      dockerfile: Dockerfile.dev
    container_name: deemona-frontend-dev
    profiles:     [dev]
    ports:
      - "5173:5173"
    volumes:
      - ./deemona-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000/api
    networks:
      - deemona-net

volumes:
  sqlserver_data:
    name: deemona_sqlserver_data
  uploads_data:
    name: deemona_uploads

networks:
  deemona-net:
    name: deemona_network
    driver: bridge
